# publish MÅSTE vara "dist" (byggd allowlist via scripts/build-dist.mjs).
# publish = "." exponerade hela repot publikt — interna inköpspriser i
# data/products.json, docs/, funktionskällkod m.m. (webbaudit 2026-07-24).
[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "stripe"]

# nemob-os/ är ett lokalt internverktyg (personlig data) och får aldrig
# serveras publikt. publish är "." så mappen måste blockeras uttryckligen.
[[redirects]]
  from = "/nemob-os/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
from = "https://nordicemobility.com/*"
to = "https://www.nordicemobility.se/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.nordicemobility.com/*"
to = "https://www.nordicemobility.se/:splat"
status = 301
force = true

[[redirects]]
from = "https://sv.nordicemobility.com/*"
to = "https://www.nordicemobility.se/:splat"
status = 301
force = true

# Kortlänk för recensioner: QR-skylten vid disken + recensions-SMS:et pekar
# hit så att mål-URL:en kan bytas utan att trycka om skyltar. 302 (inte 301)
# så webbläsare inte cachar om Google-länken ändras.
[[redirects]]
  from = "/recension"
  to = "https://search.google.com/local/writereview?placeid=ChIJKf677IQVXEYRQ2PpQIs1Gx4"
  status = 302
  force = true

[[redirects]]
  from = "/nordic-emobility-site"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/nordic-emobility-site/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/service-page/el-elektronik"
  to = "/elscooter-reparation-orebro/"
  status = 301

[[redirects]]
  from = "/service-page/batteri"
  to = "/batterireparation-elscooter/"
  status = 301

[[redirects]]
  from = "/service-page/punktering"
  to = "/punktering-elscooter-orebro/"
  status = 301

[[redirects]]
  from = "/service-page/*"
  to = "/book-online/"
  status = 301

# Wix-arvda paths som inte finns pa .se-sajten.
# Innan dessa: wildcard-redirect fran .com gjorde att gamla .com-URLer
# landade pa motsvarande .se-path som 404:ade -> SEO-laeckage (300+ exp/manad).
[[redirects]]
  from = "/elscooter-service-orebro"
  to = "/elscooter-reparation-orebro/"
  status = 301

[[redirects]]
  from = "/boka-service"
  to = "/book-online/"
  status = 301

[[redirects]]
  from = "/pricing-plans/list"
  to = "/priser/"
  status = 301

[[redirects]]
  from = "/pricing-plans/*"
  to = "/priser/"
  status = 301

[[redirects]]
  from = "/category/nya-elscootrar"
  to = "/nya-elscootrar/"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/nya-elscootrar/"
  status = 301

# Produktsidor pa gamla Wix: fanns enskilda /product-page/<slug>-routes.
# Vi har ingen 1:1 mappning - skicka till nya-elscootrar/ (riktigt produkt-katalog)
# istallet for tidigare hash-anchor /#produkter (laddade hem + scroll, ingen SEO-vinning).
[[redirects]]
  from = "/product-page/*"
  to = "/nya-elscootrar/"
  status = 301

[[redirects]]
  from = "/bookings-checkout/*"
  to = "/book-online/"
  status = 301

[[redirects]]
  from = "/book-online"
  to = "/book-online/"
  status = 301

# Produktsidor genereras under /produkt/<id>/ — bara roten redirectas.
[[redirects]]
  from = "/produkt"
  to = "/nya-elscootrar/"
  status = 301

[[redirects]]
  from = "/produkt/"
  to = "/nya-elscootrar/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP i Report-Only först (webbaudit åtgärd 25): övervaka i webbläsar-
    # konsolen/rapporter innan den görs blockerande. img-src https: krävs så
    # länge leverantörsbilder (Shopify/NAVEE m.fl.) inte är helt lokalspeglade.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS saknar innehållshash i filnamnen och får därför INTE ha immutable
# årslång cache — en deploy kunde annars lämna kunder med gammal kod i upp
# till ett år (webbaudit 2026-07-24). Bilder/ljud är stabila och cachas långt.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
